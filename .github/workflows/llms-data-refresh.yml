name: LLMs — Publicar na Vercel

# Publica o SaibaTudo LLMs na Vercel (projeto saibatudo-llms) a partir do pacote de dados VERSIONADO em apps/llms/data/llms (o GloVe não muda:
# não há coleta nem agenda). Só sob demanda: gh workflow run llms-data-refresh.yml. Push na main NÃO publica.
# Repositório único: segredos com sufixo LLMS (VERCEL_PROJECT_ID_LLMS); VERCEL_ORG_ID e VERCEL_TOKEN_TIME (token do time) são compartilhados.
# Antes de publicar: assinatura do pacote, testes de integridade e build. Depois: health do site publicado.
on:
  workflow_dispatch:

concurrency:
  group: llms-data-refresh
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/llms

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_LLMS }}
      TEM_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_TIME != '' }}
      SAIBATUDO_ASK_ENABLED: ${{ vars.LLMS_ASK_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install ecdsa==0.19.2

      - name: Pacote versionado existe e está assinado
        run: |
          test -f data/llms/manifest.json || { echo "::error::apps/llms/data/llms/manifest.json ausente: gere o pacote localmente (pipeline/gerar_pacote.py) e versione"; exit 1; }
          python pipeline/sign.py verify data/llms/manifest.json --public pipeline/data_signing_public.pem

      - name: Testes de integridade (site e API)
        run: |
          node --test "web/test/*.test.mjs"
          node --test "api/test/*.test.mjs"

      - name: Build do site com o pacote real
        run: node web/build.mjs

      - name: Publicar na Vercel (produção)
        if: env.TEM_VERCEL_TOKEN == 'true'
        run: |
          npm i -g vercel@latest
          ok=0
          for i in 1 2 3; do
            if vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN_TIME }}"; then ok=1; break; fi
            echo "::warning::deploy falhou (tentativa $i/3)"; sleep $((i * 20))
          done
          test "$ok" = 1

      - name: Saúde do site publicado
        if: env.TEM_VERCEL_TOKEN == 'true'
        run: |
          sleep 20
          curl -fsS https://saibatudo-llms.vercel.app/llms/api/health | tee /dev/stderr | grep -q '"ok":true'
          echo "ASK (LLMS_ASK_ENABLED no GitHub = ${SAIBATUDO_ASK_ENABLED:-vazio}; o que vale é ASK_ENABLED na Vercel)"
